<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Système de reconnaissance ESP32-CAM - illustration en ligne">
  <title>Système de Reconnaissance ESP32-CAM</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Cadre des yeux (fr) supérieur -->
  <rect x="70" y="60" width="460" height="240" rx="10" fill="none" stroke="#667eea" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Visage -->
  <ellipse cx="300" cy="190" rx="120" ry="90" fill="none" stroke="#2d2d3d" stroke-width="5"/>

  <!-- Yeux -->
  <ellipse cx="252" cy="170" rx="20" ry="12" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <ellipse cx="348" cy="170" rx="20" ry="12" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <circle cx="252" cy="170" r="5" fill="#2d2d3d"/>
  <circle cx="348" cy="170" r="5" fill="#2d2d3d"/>
  <!-- Sourcils -->
  <path d="M228 150 Q252 142 276 152" fill="none" stroke="#2d2d3d" stroke-width="5" stroke-linecap="round"/>
  <path d="M324 152 Q348 142 372 150" fill="none" stroke="#2d2d3d" stroke-width="5" stroke-linecap="round"/>

  <!-- Nez -->
  <path d="M300 200 L292 218 M300 200 L308 218 M292 218 L308 218" fill="none" stroke="#2d2d3d" stroke-width="4" stroke-linecap="round"/>

  <!-- Sourire -->
  <path d="M258 248 Q300 260 342 248" fill="none" stroke="#2d2d3d" stroke-width="5" stroke-linecap="round"/>

  <!-- Correspondance confiance -->
  <text x="452" y="120" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#667eea">98,2%</text>

  <!-- Module caméra -->
  <rect x="120" y="320" width="200" height="62" rx="10" fill="none" stroke="#2d2d3d" stroke-width="5"/>
  <rect x="160" y="332" width="56" height="38" rx="6" fill="none" stroke="#667eea" stroke-width="4"/>
  <circle cx="188" cy="351" r="12" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <circle cx="188" cy="351" r="5" fill="#2d2d3d"/>
  <text x="220" y="358" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2d2d3d">ESP32-CAM</text>

  <!-- Carte SD -->
  <rect x="360" y="332" width="66" height="24" rx="5" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="393" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#2d2d3d">microSD</text>

  <!-- Diffusion WiFi -->
  <g stroke="#667eea" stroke-width="3" fill="none">
    <path d="M470 350 Q496 330 522 350"/>
    <path d="M470 350 Q496 366 522 350"/>
  </g>

  <!-- Étiquette live -->
  <text x="548" y="240" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#667eea" transform="rotate(90 548 240)">LIVE</text>
  <circle cx="548" cy="180" r="8" fill="#f0932b" stroke="none"/>
</svg>