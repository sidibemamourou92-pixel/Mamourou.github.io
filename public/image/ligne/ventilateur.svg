<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ventilateur automatique intelligent - illustration en ligne">
  <title>Ventilateur Automatique Intelligent</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Support / pied du ventilateur -->
  <ellipse cx="300" cy="352" rx="130" ry="22" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <path d="M300 352 L300 250" fill="none" stroke="#2d2d3d" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="300" cy="250" rx="60" ry="22" fill="none" stroke="#2d2d3d" stroke-width="4"/>

  <!-- Moteur / rotor -->
  <circle cx="300" cy="250" r="52" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <circle cx="300" cy="250" r="12" fill="none" stroke="#2d2d3d" stroke-width="4"/>

  <!-- Hélice -->
  <g fill="none" stroke="#2d2d3d" stroke-width="7" stroke-linecap="round">
    <path d="M300 250 C320 210 350 180 370 150"/>
    <path d="M300 250 C280 210 250 180 230 150"/>
    <path d="M300 250 C320 290 350 320 370 350"/>
    <path d="M300 250 C280 290 250 320 230 350"/>
  </g>

  <!-- Grille de protection -->
  <circle cx="300" cy="250" r="150" fill="none" stroke="#2d2d3d" stroke-width="5"/>
  <circle cx="300" cy="250" r="135" fill="none" stroke="#2d2d3d" stroke-width="2"/>
  <circle cx="300" cy="250" r="118" fill="none" stroke="#2d2d3d" stroke-width="2"/>
  <g stroke="#2d2d3d" stroke-width="2">
    <line x1="150" y1="250" x2="450" y2="250"/>
    <line x1="300" y1="100" x2="300" y2="400"/>
    <line x1="196" y1="146" x2="404" y2="354"/>
    <line x1="196" y1="354" x2="404" y2="146"/>
  </g>

  <!-- Capteur DHT11 à gauche -->
  <g>
    <rect x="30" y="130" width="80" height="56" rx="10" fill="none" stroke="#2d2d3d" stroke-width="4"/>
    <text x="70" y="152" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2d2d3d">DHT11</text>
    <text x="70" y="172" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">T°C 24,5</text>
    <!-- onde de mesure -->
    <path d="M40 210 Q52 196 70 206 Q88 216 96 208" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="236" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#667eea">Température</text>
  </g>

  <!-- Écran LCD à droite -->
  <g>
    <rect x="470" y="120" width="100" height="70" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
    <rect x="486" y="134" width="68" height="42" rx="4" fill="none" stroke="#667eea" stroke-width="3"/>
    <line x1="492" y1="172" x2="548" y2="172" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="216" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">Ventil : ON</text>
  </g>

  <!-- Flèche de flux d'air -->
  <g stroke="#667eea" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M462 250 L548 250 M548 250 L574 246 M548 250 L548 254"/>
  </g>
</svg>