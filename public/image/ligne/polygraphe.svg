<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Polygraphe bio-électronique ESP32 - illustration en ligne">
  <title>Polygraphe Bio-Électronique (ESP32)</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Boîtier du polygraphe -->
  <rect x="120" y="120" width="360" height="180" rx="16" fill="none" stroke="#2d2d3d" stroke-width="6"/>

  <!-- Écran OLED avec courbes -->
  <rect x="150" y="145" width="300" height="90" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="300" y="162" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#2d2d3d">Ch. 1</text>
  <!-- courbe de signal stable -->
  <path d="M160 225 Q190 200 220 208 Q250 180 280 205 Q310 190 340 208 Q370 195 390 205 Q420 200 440 208"
        fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  <!-- barres -->
  <line x1="170" y1="242" x2="190" y2="242" stroke="#2d2d3d" stroke-width="2"/>
  <line x1="170" y1="242" x2="178" y2="206" stroke="#2d2d3d" stroke-width="2"/>
  <line x1="180" y1="242" x2="188" y2="214" stroke="#2d2d3d" stroke-width="2"/>
  <text x="300" y="258" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">stable</text>

  <!-- Curseur / voyant -->
  <circle cx="152" cy="130" r="6" fill="#667eea" stroke="none"/>
  <circle cx="152" cy="130" r="6" fill="none" stroke="#2d2d3d" stroke-width="2"/>

  <!-- Électrodes (capteurs cuivre) -->
  <g>
    <rect x="70" y="220" width="30" height="54" rx="6" fill="none" stroke="#2d2d3d" stroke-width="4"/>
    <path d="M50 250 L70 250 M50 252 L42 260" fill="none" stroke="#2d2d3d" stroke-width="4" stroke-linecap="round"/>
    <text x="85" y="212" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#2d2d3d">capteur</text>
  </g>

  <!-- fil vers l'électrode 2 -->
  <path d="M120 210 Q200 200 260 210" fill="none" stroke="#2d2d3d" stroke-width="3"/>
  <rect x="470" y="240" width="30" height="54" rx="6" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <path d="M480 240 Q520 220 540 210" fill="none" stroke="#2d2d3d" stroke-width="3"/>

  <!-- Main avec réaction -->  
  <path d="M470 236 C460 300 520 320 560 300" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <g stroke="#2d2d3d" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M500 260 L505 242"/>
    <path d="M506 258 L494 232"/>
    <path d="M512 262 L524 236"/>
  </g>

  <!-- Courbe de stress (pic) -->
  <path d="M505 330 Q520 290 540 322" fill="none" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
  <text x="492" y="356" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#667eea">stress !</text>
</svg>