<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Voiture télécommandée et autonome - illustration en ligne">
  <title>Voiture Télécommandée & Autonome</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Sol -->
  <line x1="70" y1="330" x2="530" y2="330" stroke="#2d2d3d" stroke-width="4" stroke-dasharray="18 10"/>

  <!-- Carrosserie -->
  <path d="M150 250 L190 240 L230 250 L230 250" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <rect x="160" y="205" width="230" height="70" rx="18" fill="none" stroke="#2d2d3d" stroke-width="5"/>
  <!-- Habitacle -->
  <rect x="285" y="205" width="70" height="42" rx="10" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <path d="M292 232 L338 232" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>

  <!-- Phares -->
  <circle cx="174" cy="222" r="5" fill="#f9ca24" stroke="none"/>
  <circle cx="174" cy="258" r="5" fill="#f9ca24" stroke="none"/>

  <!-- Capteur ultrason à l'avant -->
  <rect x="360" y="220" width="34" height="28" rx="6" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <circle cx="377" cy="234" r="4" fill="none" stroke="#2d2d3d" stroke-width="2"/>
  <circle cx="377" cy="252" r="4" fill="none" stroke="#2d2d3d" stroke-width="2"/>
  <!-- ondes sonores -->
  <g stroke="#667eea" stroke-width="3" fill="none">
    <path d="M398 234 Q420 226 446 234"/>
    <path d="M398 252 Q420 260 446 252"/>
  </g>

  <!-- Antenne Bluetooth -->
  <path d="M250 205 L268 168" fill="none" stroke="#2d2d3d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="268" cy="166" r="9" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <g stroke="#667eea" stroke-width="3" fill="none">
    <path d="M214 146 Q230 128 248 140"/>
    <path d="M232 132 Q248 114 264 126"/>
  </g>

  <!-- Roues avant -->
  <g fill="none" stroke="#2d2d3d" stroke-width="5">
    <circle cx="205" cy="282" r="30"/>
    <circle cx="205" cy="282" r="14"/>
    <circle cx="350" cy="282" r="30"/>
    <circle cx="350" cy="282" r="14"/>
  </g>

  <!-- Bouclier anti-collision (tracé virtuel) -->
  <path d="M60 200 L540 200" fill="none" stroke="#667eea" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Étiquette de mode -->
  <text x="390" y="340" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#667eea">Mode autonome (évitement d'obstacles)</text>
</svg>