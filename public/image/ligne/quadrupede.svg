<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Robot quadrupède ESP32 - illustration en ligne">
  <title>Robot Quadrupède (ESP32)</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Sol -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#2d2d3d" stroke-width="4" stroke-dasharray="16 10"/>

  <!-- Corps du robot -->
  <rect x="210" y="120" width="190" height="90" rx="18" fill="none" stroke="#2d2d3d" stroke-width="5"/>
  <!-- Panneau (visage) -->
  <rect x="235" y="140" width="70" height="46" rx="6" fill="none" stroke="#667eea" stroke-width="4"/>
  <circle cx="258" cy="163" r="7" fill="none" stroke="#667eea" stroke-width="3"/>
  <circle cx="282" cy="163" r="7" fill="none" stroke="#667eea" stroke-width="3"/>
  <path d="M258 178 Q270 184 282 178" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenne Bluetooth -->
  <line x1="380" y1="120" x2="398" y2="82" stroke="#2d2d3d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="398" cy="80" r="10" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <g stroke="#667eea" stroke-width="3" fill="none">
    <path d="M340 66 Q356 52 374 64"/>
    <path d="M360 52 Q376 36 394 50"/>
  </g>

  <!-- Capteur de distance avant -->
  <rect x="160" y="165" width="34" height="22" rx="5" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <circle cx="177" cy="190" r="4" fill="none" stroke="#2d2d3d" stroke-width="2"/>
  <circle cx="177" cy="162" r="4" fill="none" stroke="#2d2d3d" stroke-width="2"/>

  <!-- Patte avant droite -->
  <g stroke="#2d2d3d" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M250 210 L250 252"/>
    <circle cx="250" cy="252" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M250 252 L232 285"/>
    <circle cx="232" cy="285" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M232 285 L224 330 L214 330"/>
  </g>

  <!-- Patte avant gauche -->
  <g stroke="#2d2d3d" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M300 210 L300 250"/>
    <circle cx="300" cy="250" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M300 250 L318 283"/>
    <circle cx="318" cy="283" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M318 283 L328 328 L342 328"/>
  </g>

  <!-- Patte arrière droite -->
  <g stroke="#2d2d3d" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M355 210 L355 255"/>
    <circle cx="355" cy="255" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M355 255 L372 288"/>
    <circle cx="372" cy="288" r="10" stroke="#667eea" stroke-width="4"/>
    <path d="M372 288 L380 330 L360 330"/>
  </g>

  <!-- Queue / batterie -->
  <rect x="400" y="150" width="46" height="30" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="423" y="169" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">7,4V</text>

  <!-- Étiquette -->
  <text x="300" y="375" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#667eea">Démarche contrôlée par Bluetooth</text>
</svg>