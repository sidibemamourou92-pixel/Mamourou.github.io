<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Raspberry Pi 5 configuration headless - illustration en ligne">
  <title>Configuration Headless Raspberry Pi 5</title>
  <rect width="600" height="400" fill="#f5f6fa"/>

  <!-- Carte Raspberry Pi -->
  <rect x="130" y="90" width="340" height="210" rx="14" fill="none" stroke="#2d2d3d" stroke-width="5"/>
  <text x="300" y="125" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d2d3d">Raspberry Pi 5</text>

  <!-- Broches GPIO -->
  <g stroke="#2d2d3d" stroke-width="3">
    <rect x="150" y="145" width="40" height="120" fill="none"/>
    <line x1="160" y1="157" x2="160" y2="253"/>
    <line x1="178" y1="157" x2="178" y2="253"/>
    <circle cx="160" cy="165" r="4"/>
    <circle cx="178" cy="165" r="4"/>
    <circle cx="160" cy="185" r="4"/>
    <circle cx="178" cy="185" r="4"/>
    <circle cx="160" cy="205" r="4"/>
    <circle cx="178" cy="205" r="4"/>
    <circle cx="160" cy="225" r="4"/>
    <circle cx="178" cy="225" r="4"/>
  </g>

  <!-- Port HDMI -->
  <rect x="240" y="165" width="70" height="34" rx="6" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="275" y="188" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">HDMI</text>

  <!-- Port USB -->
  <rect x="330" y="165" width="60" height="34" rx="6" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="360" y="188" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">USB</text>

  <!-- Logo / CPU -->
  <rect x="330" y="215" width="90" height="60" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="375" y="252" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#2d2d3d">CPU</text>

  <!-- Clé USB boot -->
  <rect x="410" y="250" width="36" height="26" rx="5" fill="none" stroke="#2d2d3d" stroke-width="4"/>

  <!-- Connexion Wi-Fi -->
  <g>
    <path d="M300 80 Q330 44 356 74" fill="none" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 72 Q348 38 376 66" fill="none" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
    <path d="M340 66 Q368 34 394 60" fill="none" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="300" cy="90" r="26" fill="none" stroke="#667eea" stroke-width="4"/>
    <path d="M290 90 L300 78 M310 90 L302 102" fill="none" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Écran terminal SSH -->
  <rect x="70" y="300" width="240" height="66" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <text x="80" y="322" font-family="monospace" font-size="11" fill="#2d2d3d">$ ssh pi@192.168.1.5</text>
  <text x="80" y="340" font-family="monospace" font-size="11" fill="#667eea">pi@raspberrypi:~ $ _</text>
  <text x="70" y="296" font-family="sans-serif" font-size="10" fill="#667eea" text-anchor="start">◂</text>

  <!-- Clé SSH -->
  <rect x="400" y="300" width="130" height="66" rx="8" fill="none" stroke="#2d2d3d" stroke-width="4"/>
  <path d="M420 320 L430 332 L424 344 L444 336" fill="none" stroke="#667eea" stroke-width="3"/>
  <text x="425" y="348" font-family="sans-serif" font-size="10" fill="#2d2d3d">clé SSH</text>
</svg>